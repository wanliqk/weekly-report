appId: com.weeklyreport.desktop
productName: Weekly Report
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: weekly-report
nsis:
  # `${name}` resolves to package.json's raw `name` field, which for this npm
  # workspace member is the scoped `@weekly-report/electron` — the `/` in
  # that gets treated as a path separator, so NSIS tries to write the
  # installer into a non-existent `dist/@weekly-report/` subdirectory and
  # fails with "Can't open output file" (found by actually running
  # `build:win`, not by inspection). `${productFilename}` is electron-builder's
  # already-sanitized, filesystem-safe variant of `productName` above.
  artifactName: ${productFilename}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
extraResources:
  - from: ../build/sidecar
    to: sidecar
    filter:
      - '**/*'
