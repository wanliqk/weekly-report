[project]
name = "weekly-report-backend"
version = "0.2.0"
description = "FastAPI sidecar for the weekly-report desktop application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite==0.21.0",
    "alembic==1.16.4",
    "argon2-cffi==25.1.0",
    "fastapi==0.116.1",
    "openpyxl==3.1.5",
    "pydantic-settings==2.10.1",
    "pyjwt==2.10.1",
    "sqlalchemy[asyncio]==2.0.42",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==1.17.1",
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "ruff==0.12.7",
]
# Only needed to produce the PyInstaller onedir sidecar release artifact
# (`weekly-report-backend.spec`); not required for the normal lint/typecheck/
# test loop, so it is kept out of `dev` and only installed on demand with
# `uv sync --directory backend --group build`.
build = [
    "pyinstaller==6.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic"]

[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
